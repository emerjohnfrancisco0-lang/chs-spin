<!--
  CHS Spin Game — verification email
  Paste this into Supabase → Authentication → Emails (Email Templates),
  into BOTH the "Magic Link" and "Confirm signup" templates.
  Subject line for both:   Your CHS Spin Game code: {{ .Token }}
-->
<!doctype html>
<html lang="en">
<body style="margin:0;padding:0;background:#FAF4E9;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FAF4E9;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:460px;background:#FFFFFF;border-radius:20px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#1A1A1A;">
          <tr><td style="height:6px;background:#E5AE60;font-size:0;line-height:0;">&nbsp;</td></tr>
          <tr>
            <td align="center" style="padding:32px 28px 8px;">
              <!-- CHS mark (pure HTML so it shows in every mail app) -->
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="width:44px;height:44px;border-top:5px solid #E5AE60;border-left:5px solid #E5AE60;border-right:5px solid #E5AE60;font-size:0;">&nbsp;</td>
                </tr>
                <tr>
                  <td style="border-left:5px solid #E5AE60;padding:2px 0 0 6px;font-weight:bold;font-size:18px;letter-spacing:1px;color:#1A1A1A;">CHS</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:12px 28px 0;">
              <p style="margin:0;font-size:12px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:#B9802F;">Spin for a chance to win</p>
              <h1 style="margin:10px 0 8px;font-size:22px;line-height:1.3;">Here’s your code</h1>
              <p style="margin:0;font-size:15px;line-height:1.6;color:#78726A;">Enter this 6-digit code in the game to verify your email and unlock your spin.</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:24px 28px;">
              <div style="display:inline-block;background:#F3ECDF;border:2px dashed #E5AE60;border-radius:14px;padding:14px 22px;font-size:34px;font-weight:bold;letter-spacing:10px;color:#1A1A1A;">{{ .Token }}</div>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 28px 30px;">
              <p style="margin:0;font-size:13px;line-height:1.6;color:#78726A;">The code expires soon and can only be used once.<br>Didn’t try to play? You can ignore this email.</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="background:#1A1A1A;padding:14px;font-size:12px;color:#F1D9AC;">One spin per person · Come say hi at the CHS booth</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
